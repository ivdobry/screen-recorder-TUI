<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges">
  <title>Screen Recorder TUI</title>
  <!-- The app's logo (LOGO_PIXELS in screen_recorder/util.py), one square per pixel -->
  <rect width="320" height="200" rx="28" fill="#21252b" shape-rendering="geometricPrecision"/>
  <rect x="40" y="40" width="40" height="20" fill="#abb2bf"/>
  <rect x="120" y="40" width="20" height="20" fill="#e06c75"/>
  <rect x="180" y="40" width="20" height="20" fill="#e06c75"/>
  <rect x="240" y="40" width="40" height="20" fill="#abb2bf"/>
  <rect x="40" y="60" width="20" height="20" fill="#abb2bf"/>
  <rect x="120" y="60" width="80" height="20" fill="#e06c75"/>
  <rect x="260" y="60" width="20" height="20" fill="#abb2bf"/>
  <rect x="100" y="80" width="20" height="20" fill="#e06c75"/>
  <rect x="140" y="80" width="40" height="20" fill="#e06c75"/>
  <rect x="200" y="80" width="20" height="20" fill="#e06c75"/>
  <rect x="100" y="100" width="120" height="20" fill="#e06c75"/>
  <rect x="40" y="120" width="20" height="20" fill="#abb2bf"/>
  <rect x="120" y="120" width="80" height="20" fill="#e06c75"/>
  <rect x="260" y="120" width="20" height="20" fill="#abb2bf"/>
  <rect x="40" y="140" width="40" height="20" fill="#abb2bf"/>
  <rect x="240" y="140" width="40" height="20" fill="#abb2bf"/>
</svg>
